  <style>

/* Debug panel container */

<body>

<div id="label">

SOMEONE, SOMEWHERE

</div>

<!-- Debug toggle button -->
<button id="debugToggle" type="button">
  Debug
</button>

<!-- Debug panel -->
<div id="debugPanel" hidden>

  <div class="head">
    <strong>Expression diagnostics</strong>

    <button id="debugClose" type="button">
      Close
    </button>
  </div>

  <!-- Current emotion status -->
  <div id="debugText">
    Waiting for camera...
  </div>

  <!-- Facial expression metrics -->

</div>

<canvas id="canvas"></canvas>

<div id="interface">

  <h1 id="title">

    How are you feeling?

  </h1>

  <div id="message">

    Let your expression become a doorway

    into feelings once carried by other people.

  </div>
  
  <button id="cameraButton">

    Start camera

  </button>

  <div id="cameraBox">

    <video

      id="webcam"

      autoplay

      Camera is off

</div>

<div id="controls">

</div>
  
<!-- EmoTogether emotion music -->
<audio id="joyMusic" src="assets/joy.mp3" loop preload="auto"></audio>
<audio id="angerMusic" src="assets/anger.mp3" loop preload="auto"></audio>
<audio id="sadnessMusic" src="assets/sadness.mp3" loop preload="auto"></audio>
  
<script>

const canvas =

  document.getElementById(

    "canvas"

  );

const ctx =

  canvas.getContext(

    "2d"

  );

let width;

let height;

let time = 0;

let emotion =

  "neutral";

const emotions = {

  neutral: {

    color:

      [180,180,180],

    speed:

      0.4,

    amplitude:

      30,

    frequency:

      0.008,

    lines:

      7,

    title:

      "How are you feeling?",

    message:

      "Let your expression become a doorway into feelings once carried by other people."

  },

  joy: {

    color:

      [245,200,60],

    speed:

      1.4,

    amplitude:

      45,

    frequency:

      0.018,

    lines:

      11,

    title:

      "I sense a trace of joy.",

    message:

      "Let it expand beyond you."

  },

  anger: {

    color:

      [220,55,45],

    speed:

      2.4,

    amplitude:

      75,

    frequency:

      0.026,

    lines:

      16,

    title:

      "I sense a trace of anger.",

    message:

      "You do not have to make it smaller."

  },

  sadness: {

    color:

      [65,150,110],

    speed:

      0.55,

    amplitude:

      25,

    frequency:

      0.006,

    lines:

      8,

    title:

      "I sense a trace of sadness.",

    message:

      "Someone, somewhere, has felt something like this too."

  }

};

function resize() {

  width =

    window.innerWidth;

  height =

    window.innerHeight;

  canvas.width =

    width;

  canvas.height =

    height;

}

window.addEventListener(

  "resize",

  resize

);

resize();

function setEmotion(name, changeMusic = true) {

  emotion = name;

  const e =

    emotions[name];

  document.getElementById(

    "title"

  ).textContent =

    e.title;

  document.getElementById(

    "message"

  ).textContent =

    e.message;
 
  // NEW: Change the music too.
  if (changeMusic) {
  playEmotionMusic(name);
}
}

function draw() {

  const e =

    emotions[emotion];

  ctx.fillStyle =

    "rgba(15,15,15,0.16)";

  ctx.fillRect(

    0,

    0,

    width,

    height

  );

  const [

    r,

    g,

    b

  ] =

    e.color;

  for (

    let line = 0;

    line < e.lines;

    line++

  ) {

    ctx.beginPath();

    const baseY =

      height / 2 +

      (

        line -

        e.lines / 2

      ) *

      18;

    for (

      let x = 0;

      x <= width;

      x += 6

    ) {

      let y =

        baseY +

        Math.sin(

          x *

          e.frequency +

          time *

          e.speed +

          line *

          0.45

        )

        *

        e.amplitude;

      if (

        emotion ===

        "anger"

      ) {

        y +=

          Math.sin(

            x *

            0.09 +

            time *

            5

          )

          *

          12;

      }

      ctx.lineTo(

        x,

        y

      );

    }

    ctx.strokeStyle =

      `rgba(

        ${r},

        ${g},

        ${b},

        ${0.15 + line * 0.025}

      )`;

    ctx.lineWidth =

      2;

    ctx.stroke();

  }

  time +=

    0.015;

  requestAnimationFrame(

    draw

  );

}

draw();
  // ==========================
// CAMERA + MEDIAPIPE
// ==========================

const video =
  document.getElementById("webcam");

const cameraButton =
  document.getElementById("cameraButton");

const cameraStatus =
  document.getElementById("cameraStatus");


let faceLandmarker = null;

let cameraRunning = false;

let lastVideoTime = -1;

let currentDetectedEmotion = "neutral";

/* Emotion confirmation timing */
let pendingEmotion = null;
let pendingEmotionSince = 0;
let lastCandidateSeenAt = 0;

const EMOTION_HOLD_MS = 1000;
const EMOTION_GAP_TOLERANCE_MS = 120;

/* Debug panel elements */
const debugPanel =
  document.getElementById("debugPanel");

const debugToggle =
  document.getElementById("debugToggle");

const debugClose =
  document.getElementById("debugClose");

const debugText =
  document.getElementById("debugText");

const debugMetrics =
  document.getElementById("debugMetrics");

/* Open or close Debug panel */
function toggleDebug(open) {
  debugPanel.hidden = !open;

  debugToggle.setAttribute(
    "aria-expanded",
    String(open)
  );
}

debugToggle.addEventListener("click", () => {
  toggleDebug(debugPanel.hidden);
});

debugClose.addEventListener("click", () => {
  toggleDebug(false);
});


// --------------------------
// 1. START CAMERA
// --------------------------

cameraButton.addEventListener(
  "click",
  startCamera
);


async function startCamera() {

  // Prevent multiple simultaneous starts.
  if (cameraRunning || cameraButton.disabled) {
    return;
  }

  cameraButton.disabled = true;
  cameraStatus.textContent =
    "Requesting camera permission...";

  let stream = null;

  // STEP A: Open the camera
  try {

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error(
        "Camera API unavailable. Please use HTTPS or localhost."
      );
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      });

    } catch (firstError) {

      // Try a general camera if the first request fails
      // because of camera constraints.
      if (
        firstError.name !== "OverconstrainedError" &&
        firstError.name !== "NotFoundError"
      ) {
        throw firstError;
      }

      stream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });
    }

    video.srcObject = stream;
    await video.play();

    video.style.display = "block";

  } catch (error) {

    console.error("Camera error:", error);

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    video.srcObject = null;

    cameraStatus.textContent =
      "Camera error: " + error.message;

    cameraButton.disabled = false;
    return;
  }

  // STEP B: Load MediaPipe
  cameraStatus.textContent =
    "Loading face model...";

  try {

    if (!faceLandmarker) {
      await createFaceLandmarker();
    }

  } catch (error) {

    console.error("MediaPipe error:", error);

    stream.getTracks().forEach(track => track.stop());

    video.srcObject = null;
    video.style.display = "none";

    cameraStatus.textContent =
      "Face model error: " + error.message;

    cameraButton.disabled = false;
    return;
  }

  // STEP C: Start expression detection
  cameraRunning = true;
  lastVideoTime = -1;

  cameraStatus.textContent =
    "Looking for your expression...";

  cameraButton.textContent = "Camera running";

  detectFace();
}



// --------------------------
// 2. CREATE MEDIAPIPE MODEL
// --------------------------

async function createFaceLandmarker() {

  const {
    FaceLandmarker,
    FilesetResolver
  } =
    await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm"
    );


  const vision =
    await FilesetResolver.forVisionTasks(

      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"

    );


  faceLandmarker =
    await FaceLandmarker.createFromOptions(

      vision,

      {

        baseOptions: {

          modelAssetPath:

            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

        },


        runningMode:
          "VIDEO",


        numFaces:
          1,


        outputFaceBlendshapes:
          true,


        minFaceDetectionConfidence:
          0.5,


        minFacePresenceConfidence:
          0.5,


        minTrackingConfidence:
          0.5

      }

    );

}



// --------------------------
// 3. READ VIDEO FRAME
// --------------------------

function detectFace() {

  if (
    !cameraRunning ||
    !faceLandmarker
  ) {

    return;

  }


  if (
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ) {


    const now =
      performance.now();


    const result =
      faceLandmarker.detectForVideo(
        video,
        now
      );


    lastVideoTime =
      video.currentTime;


    analyseExpression(
      result
    );

  }


  requestAnimationFrame(
    detectFace
  );

}



// --------------------------
// 4. READ BLENDSHAPES
// --------------------------


function analyseExpression(result) {

  const now = performance.now();

  // 1. Check whether a face is detected
  if (
    !result.faceBlendshapes ||
    result.faceBlendshapes.length === 0
  ) {
    pendingEmotion = null;
    pendingEmotionSince = 0;
    lastCandidateSeenAt = 0;
    
    cancelMusicTransition();
    cameraStatus.textContent = "No face detected";
    debugText.textContent = "No face detected";
    debugMetrics.replaceChildren();

    return;
  }

  // 2. Read MediaPipe blendshape scores
  const scores = {};

  for (
    const item of result.faceBlendshapes[0].categories
  ) {
    scores[item.categoryName] = item.score;
  }

  // 3. Calculate candidate emotion
  const details = calculateEmotionDetails(scores);
  const candidate = details.emotion;

  // 4. Neutral cancels pending change
  if (candidate === "neutral") {
    cancelMusicTransition();
    pendingEmotion = null;
    pendingEmotionSince = 0;
    lastCandidateSeenAt = 0;

    cameraStatus.textContent = "Detected: neutral";

    renderDebug(details);
    return;
  }

  // 5. Same emotion needs no switching
  if (candidate === currentDetectedEmotion) {
    cancelMusicTransition();
    pendingEmotion = null;
    pendingEmotionSince = 0;
    lastCandidateSeenAt = 0;

    cameraStatus.textContent =
      "Detected: " + candidate;

    renderDebug(details);
    return;
  }

  // 6. Start or restart confirmation timer
  if (
    candidate !== pendingEmotion ||
    (
      lastCandidateSeenAt &&
      now - lastCandidateSeenAt >
        EMOTION_GAP_TOLERANCE_MS
    )
  ) {
    pendingEmotion = candidate;
    pendingEmotionSince = now;
    beginMusicTransition(
      candidate,
      pendingEmotionSince
);
  }

  lastCandidateSeenAt = now;

  // 7. Calculate confirmation progress
  const elapsed = now - pendingEmotionSince;

  const progress = Math.min(
    100,
    Math.floor(
      elapsed / EMOTION_HOLD_MS * 100
    )
  );

  cameraStatus.textContent =
    "Detected: " + candidate +
    " (" + progress + "%)";

  // 8. Switch after one full second
  if (elapsed >= EMOTION_HOLD_MS) {
    currentDetectedEmotion = candidate;

    pendingEmotion = null;
    pendingEmotionSince = 0;
    lastCandidateSeenAt = 0;

    setEmotion(candidate, false);
    finishMusicTransition(candidate);
  }

  renderDebug(details);
}

  
/* Limit Debug updates to about 10 times per second */
let lastDebugPaint = 0;

function renderDebug(details) {

  const now = performance.now();

  if (now - lastDebugPaint < 100) {
    return;
  }

  lastDebugPaint = now;

  // 1. Calculate pending progress
  const progress = pendingEmotion
    ? Math.min(
        100,
        Math.floor(
          (now - pendingEmotionSince) /
          EMOTION_HOLD_MS * 100
        )
      )
    : 0;

  // 2. Display emotion status and scores
  debugText.textContent =
    `Candidate: ${details.emotion}
Active: ${currentDetectedEmotion}
Pending: ${pendingEmotion || "none"} (${progress}%)

Raw composite scores:
Joy: ${details.joy.toFixed(3)}
Sadness: ${details.sadness.toFixed(3)}
Anger: ${details.anger.toFixed(3)}

Thresholds:
Joy: ${details.thresholds.joy}
Sadness: ${details.thresholds.sadness}
Anger: ${details.thresholds.anger}

Eligible:
Joy: ${details.gates.joy ? "YES" : "NO"}
Sadness: ${details.gates.sadness ? "YES" : "NO"}
Anger: ${details.gates.anger ? "YES" : "NO"}

Anger requires browDown >= 0.07
and eyeSquint >= 0.15.
Sadness requires mouthFrown >= 0.015.`;

  // 3. Clear previous metric bars
  debugMetrics.replaceChildren();

  // 4. Create one bar for each facial feature
  for (
    const [name, value] of
    Object.entries(details.features)
  ) {

    const wrap = document.createElement("div");
    wrap.className = "metric";

    const label = document.createElement("div");
    label.textContent =
      `${name}: ${value.toFixed(3)}`;

    const track = document.createElement("div");
    track.className = "track";

    const fill = document.createElement("div");
    fill.className = "fill";

    fill.style.width =
      `${Math.max(0, Math.min(100, value * 100))}%`;

    track.appendChild(fill);
    wrap.append(label, track);
    debugMetrics.appendChild(wrap);
  }
}


// --------------------------
// 5. CALCULATE EMOTION
// --------------------------

/* Temporary bridge — replace in Step 5 */
function calculateEmotionDetails(s) {

  const detectedEmotion = calculateEmotion(s);

  const avg = (left, right) =>
    ((s[left] || 0) + (s[right] || 0)) / 2;

  const smile = avg(
    "mouthSmileLeft", "mouthSmileRight"
  );

  const cheekSquint = avg(
    "cheekSquintLeft", "cheekSquintRight"
  );

  const mouthFrown = avg(
    "mouthFrownLeft", "mouthFrownRight"
  );

  const browDown = avg(
    "browDownLeft", "browDownRight"
  );

  const mouthPress = avg(
    "mouthPressLeft", "mouthPressRight"
  );

  const noseSneer = avg(
    "noseSneerLeft", "noseSneerRight"
  );

  const browInnerUp = s.browInnerUp || 0;

  const eyeSquint = avg(
    "eyeSquintLeft", "eyeSquintRight"
  );

  const adjustedFrown =
    Math.sqrt(Math.max(0, mouthFrown));

  // Old formulas, only for Step 4 testing
  const joy = smile * 0.75 + cheekSquint * 0.25;
  const sadness = mouthFrown * 0.6 + browInnerUp * 0.4;
  const anger =
    browDown * 0.55 +
    mouthPress * 0.30 +
    noseSneer * 0.15;

  const thresholds = {
    joy: 0.25,
    sadness: 0.25,
    anger: 0.25
  };

  const gates = {
    joy: detectedEmotion === "joy",
    sadness: detectedEmotion === "sadness",
    anger: detectedEmotion === "anger"
  };

  return {
    emotion: detectedEmotion,
    joy,
    sadness,
    anger,
    thresholds,
    gates,
    features: {
      smile,
      cheekSquint,
      mouthFrown,
      adjustedFrown,
      browInnerUp,
      browDown,
      eyeSquint,
      mouthPress
    }
  };
}

  
function calculateEmotion(s) {


  const smile =

    (
      (s.mouthSmileLeft || 0) +
      (s.mouthSmileRight || 0)

    ) / 2;



  const cheekSquint =

    (
      (s.cheekSquintLeft || 0) +
      (s.cheekSquintRight || 0)

    ) / 2;



  const frown =

    (
      (s.mouthFrownLeft || 0) +
      (s.mouthFrownRight || 0)

    ) / 2;



  const browDown =

    (
      (s.browDownLeft || 0) +
      (s.browDownRight || 0)

    ) / 2;



  const mouthPress =

    (
      (s.mouthPressLeft || 0) +
      (s.mouthPressRight || 0)

    ) / 2;



  const browInnerUp =
    s.browInnerUp || 0;



  const noseSneer =

    (
      (s.noseSneerLeft || 0) +
      (s.noseSneerRight || 0)

    ) / 2;



  // ------------------
  // EMOTION SCORES
  // ------------------


  const joy =

    smile * 0.75 +

    cheekSquint * 0.25;



  const sadness =

    frown * 0.6 +

    browInnerUp * 0.4;



  const anger =

    browDown * 0.55 +

    mouthPress * 0.30 +

    noseSneer * 0.15;



  const emotionScores = {

    joy,
    sadness,
    anger

  };


  let bestEmotion =
    "neutral";


  let bestScore =
    0;


  for (
    const [
      emotion,
      score
    ]
    of Object.entries(
      emotionScores
    )
  ) {

    if (
      score >
      bestScore
    ) {

      bestEmotion =
        emotion;

      bestScore =
        score;

    }

  }



  // Only react if signal
  // is strong enough

  if (
    bestScore < 0.25
  ) {

    return "neutral";

  }


  return bestEmotion;

}
</script>

<script>


/* =========================
   EMOTION MUSIC PLAYER
   With 1-second sequential fade
========================= */

const emotionMusic = {
  joy: document.getElementById("joyMusic"),
  anger: document.getElementById("angerMusic"),
  sadness: document.getElementById("sadnessMusic")
};


const MUSIC_START_TIME = {
  joy: 0,
  anger: 3,
  sadness: 3
};

function getMusicStartTime(emotionName) {
  return MUSIC_START_TIME[emotionName] ?? 0;
}

  
let currentMusicEmotion = null;
let musicRequestId = 0;

let musicTransition = null;
let musicAnimationId = null;

const MUSIC_RECOVERY_MS = 250;

// Keep volume between 0 and 1
function clampVolume(value) {
  return Math.max(0, Math.min(1, value));
}

// Stop any previous volume animation
function stopMusicAnimation() {
  if (musicAnimationId !== null) {
    cancelAnimationFrame(musicAnimationId);
    musicAnimationId = null;
  }
}

// Play audio and safely handle browser errors
function safePlay(music) {
  if (!music || !music.paused) return;

  const request = music.play();

  if (request && typeof request.catch === "function") {
    request.catch(error => {
      console.log("Music playback failed:", error);
    });
  }
}

// Stop every track except the selected one
function stopOtherMusic(keepMusic = null) {
  Object.values(emotionMusic).forEach(music => {
    if (music !== keepMusic) {
      music.pause();
      music.currentTime = 0;
      music.volume = 1;
    }
  });
}

// Normal immediate music switching
function playEmotionMusic(emotionName) {

  musicRequestId++;
  musicTransition = null;
  stopMusicAnimation();

  const selectedMusic = emotionMusic[emotionName];

  if (!selectedMusic) {
    stopOtherMusic();
    currentMusicEmotion = null;
    return;
  }

  if (
    emotionName === currentMusicEmotion &&
    !selectedMusic.paused
  ) {
    selectedMusic.volume = 1;
    stopOtherMusic(selectedMusic);
    return;
  }

  stopOtherMusic(selectedMusic);

  selectedMusic.pause();
  selectedMusic.currentTime =
    getMusicStartTime(emotionName);
  selectedMusic.volume = 1;

  currentMusicEmotion = emotionName;
  safePlay(selectedMusic);
}

// Begin a pending emotion transition
function beginMusicTransition(targetEmotion, startTime) {

  musicRequestId++;
  stopMusicAnimation();

  const fromEmotion = currentMusicEmotion;
  const fromMusic = emotionMusic[fromEmotion];
  const toMusic = emotionMusic[targetEmotion];

  if (!toMusic) return;

  musicTransition = {
    fromEmotion,
    targetEmotion,
    startTime,
    fromStartVolume: fromMusic ? fromMusic.volume : 0
  };

  // Prepare the next track silently
  if (toMusic !== fromMusic) {
  toMusic.pause();

  toMusic.currentTime =
    getMusicStartTime(targetEmotion);

  toMusic.volume = 0;
  }

  function animate() {

    if (
      !musicTransition ||
      musicTransition.targetEmotion !== targetEmotion ||
      musicTransition.startTime !== startTime
    ) {
      return;
    }

    const elapsed = Math.max(
      0,
      performance.now() - startTime
    );

    const progress = clampVolume(
      elapsed / EMOTION_HOLD_MS
    );

    // First half: old music fades to zero
    if (fromMusic) {
      fromMusic.volume =
        musicTransition.fromStartVolume *
        (1 - clampVolume(progress * 2));
    }

    // Second half: new music fades in
    if (progress >= 0.5) {
      if (toMusic !== fromMusic) {
        toMusic.volume =
          clampVolume((progress - 0.5) * 2);

        safePlay(toMusic);
      }
    }

    if (progress < 1) {
      musicAnimationId =
        requestAnimationFrame(animate);
    } else {
      musicAnimationId = null;
    }
  }

  musicAnimationId =
    requestAnimationFrame(animate);
}

// Cancel a pending transition and restore old music
function cancelMusicTransition() {

  if (!musicTransition) return;

  musicRequestId++;
  stopMusicAnimation();

  const fromMusic =
    emotionMusic[musicTransition.fromEmotion];

  const toMusic =
    emotionMusic[musicTransition.targetEmotion];

  musicTransition = null;

  // Remove the unconfirmed new track
  if (toMusic && toMusic !== fromMusic) {
    toMusic.pause();
    toMusic.currentTime = 0;
    toMusic.volume = 1;
  }

  if (!fromMusic) return;

  const startVolume = fromMusic.volume;
  const recoveryStart = performance.now();

  safePlay(fromMusic);

  function recover() {

    const progress = clampVolume(
      (performance.now() - recoveryStart) /
      MUSIC_RECOVERY_MS
    );

    fromMusic.volume =
      startVolume + (1 - startVolume) * progress;

    if (progress < 1) {
      musicAnimationId =
        requestAnimationFrame(recover);
    } else {
      musicAnimationId = null;
    }
  }

  musicAnimationId =
    requestAnimationFrame(recover);
}

// Finalize a confirmed transition
function finishMusicTransition(targetEmotion) {

  musicRequestId++;
  stopMusicAnimation();

  const selectedMusic = emotionMusic[targetEmotion];

  musicTransition = null;

  if (!selectedMusic) {
    playEmotionMusic(targetEmotion);
    return;
  }

  stopOtherMusic(selectedMusic);

  selectedMusic.volume = 1;
  currentMusicEmotion = targetEmotion;

  safePlay(selectedMusic);
}
