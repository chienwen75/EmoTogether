<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0"

  >

  <title>Someone, Somewhere</title>
 
  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      overflow: hidden;

      background: #111;

      color: white;

      font-family:

        Arial,

        Helvetica,

        sans-serif;

    }

    canvas {

      position: fixed;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      z-index: 0;

    }

    #interface {

      position: fixed;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      z-index: 10;

      padding: 30px;

    }

    h1 {

      font-size: clamp(

        36px,

        8vw,

        80px

      );

      margin-bottom: 20px;

      font-weight: 400;

    }

    #message {

      max-width: 600px;

      font-size: 18px;

      line-height: 1.5;

      opacity: 0.8;

    }

    #controls {

      position: fixed;

      bottom: 30px;

      left: 50%;

      transform: translateX(-50%);

      display: flex;

      gap: 10px;

      z-index: 20;

    }

    button {

      border: 1px solid white;

      background:

        rgba(0,0,0,0.25);

      color: white;

      padding:

        12px 18px;

      border-radius: 100px;

      font-size: 15px;

      cursor: pointer;

      backdrop-filter:

        blur(10px);

    }

    button:hover {

      background: white;

      color: black;

    }

    #label {

      position: fixed;

      top: 25px;

      left: 25px;

      font-size: 12px;

      letter-spacing: 2px;

      opacity: 0.5;

      z-index: 20;

    }

    #cameraButton {
  
    margin-top: 28px;
  
  }
  
  
  #cameraBox {
  
    margin-top: 20px;
  
    width: min(320px, 80vw);
  
    position: relative;
  
  }
  
  
  #webcam {
  
    width: 100%;
  
    border-radius: 20px;
  
    display: none;
  
    transform: scaleX(-1);
  
    opacity: 0.75;
  
  }
  
  
  #cameraStatus {
  
    margin-top: 10px;
  
    font-size: 13px;
  
    opacity: 0.6;
  
  } 
    
/* Debug panel container */
#debugPanel {
  position: fixed;
  right: 12px;
  bottom: 12px;
  width: min(340px, calc(100vw - 24px));
  max-height: 48vh;
  overflow: auto;

  background: rgba(12, 18, 24, 0.94);
  color: #fff;
  border: 1px solid #555;
  border-radius: 12px;
  padding: 12px;

  z-index: 40;
  font: 12px/1.45 monospace;
  text-align: left;
}

/* Hide panel when closed */
#debugPanel[hidden] {
  display: none;
}

/* Individual metric */
#debugPanel .metric {
  margin: 5px 0;
}

/* Metric progress bar */
#debugPanel .track {
  height: 5px;
  background: #444;
  border-radius: 5px;
  overflow: hidden;
}

/* Filled part of progress bar */
#debugPanel .fill {
  height: 100%;
  background: #79cbb0;
}

/* Panel header */
#debugPanel .head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Close button */
#debugPanel button {
  padding: 4px 10px;
  font-size: 12px;
}

/* Debug toggle button */
#debugToggle {
  position: fixed;
  right: 12px;
  top: 15px;
  z-index: 45;
}

/* Debug information text */
#debugText {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

  </style>

</head>

<body>

<div id="label">

SOMEONE, SOMEWHERE

</div>

<!-- Debug toggle button -->
<button id="debugToggle" type="button">
  Debug
</button>

<!-- Debug panel -->
<div id="debugPanel" hidden>

  <div class="head">
    <strong>Expression diagnostics</strong>

    <button id="debugClose" type="button">
      Close
    </button>
  </div>

  <!-- Current emotion status -->
  <div id="debugText">
    Waiting for camera...
  </div>

  <!-- Facial expression metrics -->
  <div id="debugMetrics"></div>

</div>

<canvas id="canvas"></canvas>

<div id="interface">

  <h1 id="title">

    How are you feeling?

  </h1>

  <div id="message">

    Let your expression become a doorway

    into feelings once carried by other people.

  </div>
  
  <button id="cameraButton">

    Start camera

  </button>

  <div id="cameraBox">

    <video

      id="webcam"

      autoplay

      playsinline

      muted>

    </video>

    <div id="cameraStatus">

      Camera is off

    </div>
  </div>
</div>

<div id="controls">

  <button onclick="setEmotion('joy')">

    Joy

  </button>

  <button onclick="setEmotion('anger')">

    Anger

  </button>

  <button onclick="setEmotion('sadness')">

    Sadness

  </button>

</div>
  
<!-- EmoTogether emotion music -->
<audio id="joyMusic" src="assets/joy.mp3" loop preload="auto"></audio>
<audio id="angerMusic" src="assets/anger.mp3" loop preload="auto"></audio>
<audio id="sadnessMusic" src="assets/sadness.mp3" loop preload="auto"></audio>
  
<script>

const canvas =

  document.getElementById(

    "canvas"

  );

const ctx =

  canvas.getContext(

    "2d"

  );

let width;

let height;

let time = 0;

let emotion =

  "neutral";

const emotions = {

  neutral: {

    color:

      [180,180,180],

    speed:

      0.4,

    amplitude:

      30,

    frequency:

      0.008,

    lines:

      7,

    title:

      "How are you feeling?",

    message:

      "Let your expression become a doorway into feelings once carried by other people."

  },

  joy: {

    color:

      [245,200,60],

    speed:

      1.4,

    amplitude:

      45,

    frequency:

      0.018,

    lines:

      11,

    title:

      "I sense a trace of joy.",

    message:

      "Let it expand beyond you."

  },

  anger: {

    color:

      [220,55,45],

    speed:

      2.4,

    amplitude:

      75,

    frequency:

      0.026,

    lines:

      16,

    title:

      "I sense a trace of anger.",

    message:

      "You do not have to make it smaller."

  },

  sadness: {

    color:

      [65,150,110],

    speed:

      0.55,

    amplitude:

      25,

    frequency:

      0.006,

    lines:

      8,

    title:

      "I sense a trace of sadness.",

    message:

      "Someone, somewhere, has felt something like this too."

  }

};

function resize() {

  width =

    window.innerWidth;

  height =

    window.innerHeight;

  canvas.width =

    width;

  canvas.height =

    height;

}

window.addEventListener(

  "resize",

  resize

);

resize();

function setEmotion(name) {

  emotion = name;

  const e =

    emotions[name];

  document.getElementById(

    "title"

  ).textContent =

    e.title;

  document.getElementById(

    "message"

  ).textContent =

    e.message;
 
  // NEW: Change the music too.
  playEmotionMusic(name);
}

function draw() {

  const e =

    emotions[emotion];

  ctx.fillStyle =

    "rgba(15,15,15,0.16)";

  ctx.fillRect(

    0,

    0,

    width,

    height

  );

  const [

    r,

    g,

    b

  ] =

    e.color;

  for (

    let line = 0;

    line < e.lines;

    line++

  ) {

    ctx.beginPath();

    const baseY =

      height / 2 +

      (

        line -

        e.lines / 2

      ) *

      18;

    for (

      let x = 0;

      x <= width;

      x += 6

    ) {

      let y =

        baseY +

        Math.sin(

          x *

          e.frequency +

          time *

          e.speed +

          line *

          0.45

        )

        *

        e.amplitude;

      if (

        emotion ===

        "anger"

      ) {

        y +=

          Math.sin(

            x *

            0.09 +

            time *

            5

          )

          *

          12;

      }

      ctx.lineTo(

        x,

        y

      );

    }

    ctx.strokeStyle =

      `rgba(

        ${r},

        ${g},

        ${b},

        ${0.15 + line * 0.025}

      )`;

    ctx.lineWidth =

      2;

    ctx.stroke();

  }

  time +=

    0.015;

  requestAnimationFrame(

    draw

  );

}

draw();
  // ==========================
// CAMERA + MEDIAPIPE
// ==========================

const video =
  document.getElementById("webcam");

const cameraButton =
  document.getElementById("cameraButton");

const cameraStatus =
  document.getElementById("cameraStatus");


let faceLandmarker = null;

let cameraRunning = false;

let lastVideoTime = -1;

let currentDetectedEmotion = "neutral";


// --------------------------
// 1. START CAMERA
// --------------------------

cameraButton.addEventListener(
  "click",
  startCamera
);


async function startCamera() {

  // Prevent multiple simultaneous starts.
  if (cameraRunning || cameraButton.disabled) {
    return;
  }

  cameraButton.disabled = true;
  cameraStatus.textContent =
    "Requesting camera permission...";

  let stream = null;

  // STEP A: Open the camera
  try {

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error(
        "Camera API unavailable. Please use HTTPS or localhost."
      );
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      });

    } catch (firstError) {

      // Try a general camera if the first request fails
      // because of camera constraints.
      if (
        firstError.name !== "OverconstrainedError" &&
        firstError.name !== "NotFoundError"
      ) {
        throw firstError;
      }

      stream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });
    }

    video.srcObject = stream;
    await video.play();

    video.style.display = "block";

  } catch (error) {

    console.error("Camera error:", error);

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    video.srcObject = null;

    cameraStatus.textContent =
      "Camera error: " + error.message;

    cameraButton.disabled = false;
    return;
  }

  // STEP B: Load MediaPipe
  cameraStatus.textContent =
    "Loading face model...";

  try {

    if (!faceLandmarker) {
      await createFaceLandmarker();
    }

  } catch (error) {

    console.error("MediaPipe error:", error);

    stream.getTracks().forEach(track => track.stop());

    video.srcObject = null;
    video.style.display = "none";

    cameraStatus.textContent =
      "Face model error: " + error.message;

    cameraButton.disabled = false;
    return;
  }

  // STEP C: Start expression detection
  cameraRunning = true;
  lastVideoTime = -1;

  cameraStatus.textContent =
    "Looking for your expression...";

  cameraButton.textContent = "Camera running";

  detectFace();
}



// --------------------------
// 2. CREATE MEDIAPIPE MODEL
// --------------------------

async function createFaceLandmarker() {

  const {
    FaceLandmarker,
    FilesetResolver
  } =
    await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm"
    );


  const vision =
    await FilesetResolver.forVisionTasks(

      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"

    );


  faceLandmarker =
    await FaceLandmarker.createFromOptions(

      vision,

      {

        baseOptions: {

          modelAssetPath:

            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

        },


        runningMode:
          "VIDEO",


        numFaces:
          1,


        outputFaceBlendshapes:
          true,


        minFaceDetectionConfidence:
          0.5,


        minFacePresenceConfidence:
          0.5,


        minTrackingConfidence:
          0.5

      }

    );

}



// --------------------------
// 3. READ VIDEO FRAME
// --------------------------

function detectFace() {

  if (
    !cameraRunning ||
    !faceLandmarker
  ) {

    return;

  }


  if (
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ) {


    const now =
      performance.now();


    const result =
      faceLandmarker.detectForVideo(
        video,
        now
      );


    lastVideoTime =
      video.currentTime;


    analyseExpression(
      result
    );

  }


  requestAnimationFrame(
    detectFace
  );

}



// --------------------------
// 4. READ BLENDSHAPES
// --------------------------

function analyseExpression(result) {


  if (
    !result.faceBlendshapes ||
    result.faceBlendshapes.length === 0
  ) {

    cameraStatus.textContent =
      "No face detected";

    return;

  }


  const categories =
    result
      .faceBlendshapes[0]
      .categories;


  const scores = {};


  for (
    const item of categories
  ) {

    scores[
      item.categoryName
    ] =
      item.score;

  }


  const emotion =
    calculateEmotion(
      scores
    );


  cameraStatus.textContent =
    "Detected: " +
    emotion;


  if (
    emotion !==
    currentDetectedEmotion
  ) {

    currentDetectedEmotion =
      emotion;


    setEmotion(
      emotion
    );

  }

}



// --------------------------
// 5. CALCULATE EMOTION
// --------------------------

function calculateEmotion(s) {


  const smile =

    (
      (s.mouthSmileLeft || 0) +
      (s.mouthSmileRight || 0)

    ) / 2;



  const cheekSquint =

    (
      (s.cheekSquintLeft || 0) +
      (s.cheekSquintRight || 0)

    ) / 2;



  const frown =

    (
      (s.mouthFrownLeft || 0) +
      (s.mouthFrownRight || 0)

    ) / 2;



  const browDown =

    (
      (s.browDownLeft || 0) +
      (s.browDownRight || 0)

    ) / 2;



  const mouthPress =

    (
      (s.mouthPressLeft || 0) +
      (s.mouthPressRight || 0)

    ) / 2;



  const browInnerUp =
    s.browInnerUp || 0;



  const noseSneer =

    (
      (s.noseSneerLeft || 0) +
      (s.noseSneerRight || 0)

    ) / 2;



  // ------------------
  // EMOTION SCORES
  // ------------------


  const joy =

    smile * 0.75 +

    cheekSquint * 0.25;



  const sadness =

    frown * 0.6 +

    browInnerUp * 0.4;



  const anger =

    browDown * 0.55 +

    mouthPress * 0.30 +

    noseSneer * 0.15;



  const emotionScores = {

    joy,
    sadness,
    anger

  };


  let bestEmotion =
    "neutral";


  let bestScore =
    0;


  for (
    const [
      emotion,
      score
    ]
    of Object.entries(
      emotionScores
    )
  ) {

    if (
      score >
      bestScore
    ) {

      bestEmotion =
        emotion;

      bestScore =
        score;

    }

  }



  // Only react if signal
  // is strong enough

  if (
    bestScore < 0.25
  ) {

    return "neutral";

  }


  return bestEmotion;

}
</script>

<script>

/* =========================
   EMOTION MUSIC PLAYER
========================= */

const emotionMusic = {
  joy: document.getElementById("joyMusic"),
  anger: document.getElementById("angerMusic"),
  sadness: document.getElementById("sadnessMusic")
};

let currentMusicEmotion = null;
let musicRequestId = 0;

function playEmotionMusic(emotionName) {

  const selectedMusic = emotionMusic[emotionName];

  // Keep playing if the correct track is already playing.
  if (
    emotionName === currentMusicEmotion &&
    selectedMusic &&
    !selectedMusic.paused
  ) {
    return;
  }

  // Invalidate previous playback requests.
  const requestId = ++musicRequestId;

  // Stop all tracks.
  Object.values(emotionMusic).forEach(music => {
    music.pause();
    music.currentTime = 0;
  });

  currentMusicEmotion = null;

  // Neutral means silence.
  if (!selectedMusic) {
    return;
  }

  selectedMusic.play()
    .then(() => {
      if (requestId === musicRequestId) {
        currentMusicEmotion = emotionName;
      } else {
        selectedMusic.pause();
      }
    })
    .catch(error => {
      console.log("Music playback failed:", error);
    });
}

</script>  

</body>
</html>
