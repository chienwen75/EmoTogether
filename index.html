<script>

const canvas =

const ctx =

let width;

let height;

let time = 0;

let emotion =

const emotions = {

  neutral: {

/* ==========================
   GEOMETRIC CROWD — STEP 7B
========================== */

// Size and density of the crowd
const CROWD_SPACING_X = 62;
const CROWD_SPACING_Y = 96;

const HEAD_RADIUS = 11;
const BODY_WIDTH = 28;
const BODY_HEIGHT = 43;

// All people generated for this page
let crowdPeople = [];

// Random value between min and max
function randomBetween(min, max) {
  return min + Math.random() * (max - min);
}

// Generate a new crowd layout
function buildCrowd() {

  crowdPeople = [];

  const columns =
    Math.ceil(width / CROWD_SPACING_X) + 2;

  const rows =
    Math.ceil(height / CROWD_SPACING_Y) + 2;

  
  // Center of the screen
  const centerX = width / 2;
  const centerY = height / 2;

  // Approximate maximum distance to a corner
  const maxDistance = Math.hypot(
    centerX + CROWD_SPACING_X,
    centerY + CROWD_SPACING_Y
  );

  
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < columns; col++) {

      const x =
        col * CROWD_SPACING_X +
        randomBetween(-5, 5) - 20;

      const y =
        row * CROWD_SPACING_Y +
        randomBetween(-5, 5) + 35;

      
      // Distance from this person to screen center
      const distance = Math.hypot(
        x - centerX,
        y - centerY
      );

      // People further away appear later
      const distanceRatio =
        Math.min(1, distance / maxDistance);

      // Add timing randomness for digital emergence
      const revealAt = Math.max(
        0,
        Math.min(
          2580,
          distanceRatio * 2520 +
          randomBetween(-90, 90)
        )
      );


      const person = {
        x,
        y,
        revealAt,
        shape: Math.floor(Math.random() * 9),
        rotation:
          Math.random() < 0.13
            ? randomBetween(-0.08, 0.08)
            : 0,
        bodyScale: randomBetween(0.90, 1.10),
        lineWidth: randomBetween(1.5, 2.1)
      };

      crowdPeople.push(person);
    }
  }
}

// Draw one person's geometric body
function drawBody(shape) {

  const w = BODY_WIDTH;
  const h = BODY_HEIGHT;
  const top = 0;
  const bottom = h;

  ctx.beginPath();

  switch (shape) {

    // Rectangle
    case 0:
      ctx.rect(-w / 2, top, w, h);
      break;

    // Wider bottom trapezoid
    case 1:
      ctx.moveTo(-w * 0.38, top);
      ctx.lineTo(w * 0.38, top);
      ctx.lineTo(w * 0.55, bottom);
      ctx.lineTo(-w * 0.55, bottom);
      ctx.closePath();
      break;

    // Wider top trapezoid
    case 2:
      ctx.moveTo(-w * 0.52, top);
      ctx.lineTo(w * 0.52, top);
      ctx.lineTo(w * 0.32, bottom);
      ctx.lineTo(-w * 0.32, bottom);
      ctx.closePath();
      break;

    // Slanted parallelogram
    case 3:
      ctx.moveTo(-w * 0.45, top);
      ctx.lineTo(w * 0.45, top);
      ctx.lineTo(w * 0.65, bottom);
      ctx.lineTo(-w * 0.25, bottom);
      ctx.closePath();
      break;

    // Inverse parallelogram
    case 4:
      ctx.moveTo(-w * 0.45, top);
      ctx.lineTo(w * 0.45, top);
      ctx.lineTo(w * 0.25, bottom);
      ctx.lineTo(-w * 0.65, bottom);
      ctx.closePath();
      break;

    // Rounded vertical body
    case 5:
      ctx.roundRect(
        -w * 0.48, top,
        w * 0.96, h,
        [10, 10, 13, 13]
      );
      break;

    // Tapered rounded body
    case 6:
      ctx.moveTo(-w * 0.45, top);
      ctx.quadraticCurveTo(
        -w * 0.62, h * 0.35,
        -w * 0.35, h * 0.84
      );
      ctx.quadraticCurveTo(
        0, h * 1.12,
        w * 0.35, h * 0.84
      );
      ctx.quadraticCurveTo(
        w * 0.62, h * 0.35,
        w * 0.45, top
      );
      ctx.closePath();
      break;

    // Narrow upper body
    case 7:
      ctx.moveTo(-w * 0.25, top);
      ctx.lineTo(w * 0.25, top);
      ctx.lineTo(w * 0.42, bottom);
      ctx.lineTo(-w * 0.42, bottom);
      ctx.closePath();
      break;

    // Shouldered geometric shape
    case 8:
      ctx.moveTo(-w * 0.25, top);
      ctx.lineTo(w * 0.25, top);
      ctx.lineTo(w * 0.25, h * 0.18);
      ctx.lineTo(w * 0.55, h * 0.18);
      ctx.lineTo(w * 0.55, bottom);
      ctx.lineTo(-w * 0.55, bottom);
      ctx.lineTo(-w * 0.55, h * 0.18);
      ctx.lineTo(-w * 0.25, h * 0.18);
      ctx.closePath();
      break;
  }

  ctx.stroke();
}

// Draw one person, with circular head
function drawPerson(person, opacity = 1) {

  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.translate(person.x, person.y);
  ctx.rotate(person.rotation);

  ctx.strokeStyle = "#f5f5f5";
  ctx.lineWidth = person.lineWidth;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  // Head is always circular
  ctx.beginPath();
  ctx.arc(
    0, -26,
    HEAD_RADIUS,
    0, Math.PI * 2
  );
  ctx.stroke();

  // Body has a random geometric shape
  ctx.save();
  ctx.scale(person.bodyScale, 1);
  drawBody(person.shape);
  ctx.restore();

  ctx.restore();
}


/* ==========================
   CROWD INTRO ANIMATION
========================== */

const CROWD_INTRO_MS = 3000;
const PERSON_FLICKER_MS = 360;

let crowdIntroStart = 0;
let crowdIntroAnimationId = null;

// Calculate visibility of each person
function getPersonOpacity(person, elapsed) {

  const age = elapsed - person.revealAt;

  // Not yet generated
  if (age < 0) {
    return 0;
  }

  // Already fully generated
  if (age >= PERSON_FLICKER_MS) {
    return 1;
  }

  // Gradually become visible
  const fadeProgress = age / PERSON_FLICKER_MS;

  // Random electronic flicker
  const flicker = randomBetween(0.18, 1);

  return Math.min(
    1,
    fadeProgress * flicker
  );
}

// Main drawing function
function draw(now) {

  const elapsed = now - crowdIntroStart;

  // Clear screen with solid black
  ctx.fillStyle = "#090909";
  ctx.fillRect(0, 0, width, height);

  // Render all people
  for (const person of crowdPeople) {

    const opacity =
      elapsed >= CROWD_INTRO_MS
        ? 1
        : getPersonOpacity(person, elapsed);

    if (opacity <= 0) continue;

    drawPerson(person, opacity);
  }

  // Keep animating only during introduction
  if (elapsed < CROWD_INTRO_MS) {
    crowdIntroAnimationId =
      requestAnimationFrame(draw);
  } else {
    crowdIntroAnimationId = null;
  }
}

// Start or restart the 3-second introduction
function startCrowdIntro() {

  if (crowdIntroAnimationId !== null) {
    cancelAnimationFrame(crowdIntroAnimationId);
  }

  crowdIntroStart = performance.now();

  crowdIntroAnimationId =
    requestAnimationFrame(draw);
}

// Generate the crowd once on page load
buildCrowd();
startCrowdIntro();

// Rebuild for a changed screen size
window.addEventListener("resize", () => {
  buildCrowd();
  startCrowdIntro();
});



  // ==========================
// CAMERA + MEDIAPIPE
// ==========================

const video =
  document.getElementById("webcam");

const cameraButton =
  document.getElementById("cameraButton");

const cameraStatus =
  document.getElementById("cameraStatus");


let faceLandmarker = null;

let cameraRunning = false;

let lastVideoTime = -1;

let currentDetectedEmotion = "neutral";

/* Emotion confirmation timing */
let pendingEmotion = null;
let pendingEmotionSince = 0;
let lastCandidateSeenAt = 0;

const EMOTION_HOLD_MS = 1000;
const EMOTION_GAP_TOLERANCE_MS = 120;

/* Debug panel elements */
const debugPanel =
  document.getElementById("debugPanel");

const debugToggle =
  document.getElementById("debugToggle");

const debugClose =
  document.getElementById("debugClose");

const debugText =
  document.getElementById("debugText");

const debugMetrics =
  document.getElementById("debugMetrics");

/* Open or close Debug panel */
function toggleDebug(open) {
  debugPanel.hidden = !open;

  debugToggle.setAttribute(
    "aria-expanded",
    String(open)
  );
}

debugToggle.addEventListener("click", () => {
  toggleDebug(debugPanel.hidden);
});

debugClose.addEventListener("click", () => {
  toggleDebug(false);
});


// --------------------------
// 1. START CAMERA
// --------------------------

cameraButton.addEventListener(
  "click",
  startCamera
);


async function startCamera() {

  // Prevent multiple simultaneous starts.
  if (cameraRunning || cameraButton.disabled) {
    return;
  }

  cameraButton.disabled = true;
  cameraStatus.textContent =
    "Requesting camera permission...";

  let stream = null;

  // STEP A: Open the camera
  try {

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error(
        "Camera API unavailable. Please use HTTPS or localhost."
      );
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user"
        },
        audio: false
      });

    } catch (firstError) {

      // Try a general camera if the first request fails
      // because of camera constraints.
      if (
        firstError.name !== "OverconstrainedError" &&
        firstError.name !== "NotFoundError"
      ) {
        throw firstError;
      }

      stream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });
    }

    video.srcObject = stream;
    await video.play();

    video.style.display = "block";

  } catch (error) {

    console.error("Camera error:", error);

    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    video.srcObject = null;

    cameraStatus.textContent =
      "Camera error: " + error.message;

    cameraButton.disabled = false;
    return;
  }

  // STEP B: Load MediaPipe
  cameraStatus.textContent =
    "Loading face model...";

  try {

    if (!faceLandmarker) {
      await createFaceLandmarker();
    }

  } catch (error) {

    console.error("MediaPipe error:", error);

    stream.getTracks().forEach(track => track.stop());

    video.srcObject = null;
    video.style.display = "none";

    cameraStatus.textContent =
      "Face model error: " + error.message;

    cameraButton.disabled = false;
    return;
  }

  // STEP C: Start expression detection
  cameraRunning = true;
  lastVideoTime = -1;

  cameraStatus.textContent =
    "Looking for your expression...";

  cameraButton.textContent = "Camera running";

  detectFace();
}



// --------------------------
// 2. CREATE MEDIAPIPE MODEL
// --------------------------

async function createFaceLandmarker() {

  const {
    FaceLandmarker,
    FilesetResolver
  } =
    await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm"
    );


  const vision =
    await FilesetResolver.forVisionTasks(

      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"

    );


  faceLandmarker =
    await FaceLandmarker.createFromOptions(

      vision,

      {

        baseOptions: {

          modelAssetPath:

            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

        },


        runningMode:
          "VIDEO",


        numFaces:
          1,


        outputFaceBlendshapes:
          true,


        minFaceDetectionConfidence:
          0.5,


        minFacePresenceConfidence:
          0.5,


        minTrackingConfidence:
          0.5

      }

    );

}



// --------------------------
// 3. READ VIDEO FRAME
// --------------------------

function detectFace() {

  if (
    !cameraRunning ||
    !faceLandmarker
  ) {

    return;

  }


  if (
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ) {


    const now =
      performance.now();


    const result =
      faceLandmarker.detectForVideo(
        video,
        now
      );


    lastVideoTime =
      video.currentTime;


    analyseExpression(
      result
    );

  }


  requestAnimationFrame(
    detectFace
  );

}



// --------------------------
// 4. READ BLENDSHAPES
// --------------------------


function analyseExpression(result) {

  const now = performance.now();

  // 1. Check whether a face is detected
  if (
    !result.faceBlendshapes ||
    result.faceBlendshapes.length === 0
  ) {
    pendingEmotion = null;
    pendingEmotionSince = 0;
    lastCandidateSeenAt = 0;
    
    cancelMusicTransition();
    cameraStatus.textContent = "No face detected";
    debugText.textContent = "No face detected";
    debugMetrics.replaceChildren();

    return;
  }

  // 2. Read MediaPipe blendshape scores
  const scores = {};

  for (
    const item of result.faceBlendshapes[0].categories
  ) {
    scores[item.categoryName] = item.score;
  }

  // 3. Calculate candidate emotion
  const details = calculateEmotionDetails(scores);
  const candidate = details.emotion;

  // 4. Neutral cancels pending change
  if (candidate === "neutral") {
    cancelMusicTransition();
    pendingEmotion = null;
    pendingEmotionSince = 0;
    lastCandidateSeenAt = 0;

    cameraStatus.textContent = "Detected: neutral";

    renderDebug(details);
    return;
  }

  // 5. Same emotion needs no switching
  if (candidate === currentDetectedEmotion) {
    cancelMusicTransition();
    pendingEmotion = null;
    pendingEmotionSince = 0;
    lastCandidateSeenAt = 0;

    cameraStatus.textContent =
      "Detected: " + candidate;

    renderDebug(details);
    return;
  }

  // 6. Start or restart confirmation timer
  if (
    candidate !== pendingEmotion ||
    (
      lastCandidateSeenAt &&
      now - lastCandidateSeenAt >
        EMOTION_GAP_TOLERANCE_MS
    )
  ) {
    pendingEmotion = candidate;
    pendingEmotionSince = now;
    beginMusicTransition(
      candidate,
      pendingEmotionSince
);
  }

  lastCandidateSeenAt = now;

  // 7. Calculate confirmation progress
  const elapsed = now - pendingEmotionSince;

  const progress = Math.min(
    100,
    Math.floor(
      elapsed / EMOTION_HOLD_MS * 100
    )
  );

  cameraStatus.textContent =
    "Detected: " + candidate +
    " (" + progress + "%)";

  // 8. Switch after one full second
  if (elapsed >= EMOTION_HOLD_MS) {
    currentDetectedEmotion = candidate;

    pendingEmotion = null;
    pendingEmotionSince = 0;
    lastCandidateSeenAt = 0;

    setEmotion(candidate, false);
    finishMusicTransition(candidate);
  }

  renderDebug(details);
}

  
/* Limit Debug updates to about 10 times per second */
let lastDebugPaint = 0;

function renderDebug(details) {

  const now = performance.now();

  if (now - lastDebugPaint < 100) {
    return;
  }

  lastDebugPaint = now;

  // 1. Calculate pending progress
  const progress = pendingEmotion
    ? Math.min(
        100,
        Math.floor(
          (now - pendingEmotionSince) /
          EMOTION_HOLD_MS * 100
        )
      )
    : 0;

  // 2. Display emotion status and scores
  debugText.textContent =
    `Candidate: ${details.emotion}
Active: ${currentDetectedEmotion}
Pending: ${pendingEmotion || "none"} (${progress}%)

Raw composite scores:
Joy: ${details.joy.toFixed(3)}
Sadness: ${details.sadness.toFixed(3)}
Anger: ${details.anger.toFixed(3)}

Thresholds:
Joy: ${details.thresholds.joy}
Sadness: ${details.thresholds.sadness}
Anger: ${details.thresholds.anger}

Eligible:
Joy: ${details.gates.joy ? "YES" : "NO"}
Sadness: ${details.gates.sadness ? "YES" : "NO"}
Anger: ${details.gates.anger ? "YES" : "NO"}

Anger requires browDown >= 0.07
and eyeSquint >= 0.15.
Sadness requires (
  mouthFrown >= 0.008 ||
  browInnerUp >= 0.08
)`;

  // 3. Clear previous metric bars
  debugMetrics.replaceChildren();

  // 4. Create one bar for each facial feature
  for (
    const [name, value] of
    Object.entries(details.features)
  ) {

    const wrap = document.createElement("div");
    wrap.className = "metric";

    const label = document.createElement("div");
    label.textContent =
      `${name}: ${value.toFixed(3)}`;

    const track = document.createElement("div");
    track.className = "track";

    const fill = document.createElement("div");
    fill.className = "fill";

    fill.style.width =
      `${Math.max(0, Math.min(100, value * 100))}%`;

    track.appendChild(fill);
    wrap.append(label, track);
    debugMetrics.appendChild(wrap);
  }
}


// --------------------------
// 5. CALCULATE EMOTION
// --------------------------


/* V4 — Emotion detection details */
function calculateEmotionDetails(s) {

  // 1. Average left and right facial signals
  const avg = (left, right) =>
    ((s[left] || 0) + (s[right] || 0)) / 2;

  // 2. Read facial features
  const smile = avg(
    "mouthSmileLeft", "mouthSmileRight"
  );

  const cheekSquint = avg(
    "cheekSquintLeft", "cheekSquintRight"
  );

  const mouthFrown = avg(
    "mouthFrownLeft", "mouthFrownRight"
  );

  const browInnerUp = s.browInnerUp || 0;

  const browDown = avg(
    "browDownLeft", "browDownRight"
  );

  const eyeSquint = avg(
    "eyeSquintLeft", "eyeSquintRight"
  );

  const mouthPress = avg(
    "mouthPressLeft", "mouthPressRight"
  );

  // 3. Enhance low frown signals
  const adjustedFrown =
    Math.sqrt(Math.max(0, mouthFrown));

  // 4. Calculate composite emotion scores
  const joy =
    smile * 0.80 +
    cheekSquint * 0.20;

  const sadness =
    adjustedFrown * 0.45 +
    browInnerUp * 0.35 +
    mouthPress * 0.20;

  const anger =
    browDown * 0.65 +
    eyeSquint * 0.25 +
    mouthPress * 0.10;

  // 5. Different thresholds for each emotion
  const thresholds = {
    joy: 0.25,
    sadness: 0.09,
    anger: 0.17
  };

  // 6. Required conditions (gates)
  const gates = {
    joy:
      joy >= thresholds.joy,

    
    sadness:
      sadness >= thresholds.sadness &&
      smile < 0.30 &&
      (
        mouthFrown >= 0.008 ||
        browInnerUp >= 0.08
      ) &&
      (
        mouthFrown >= 0.008 ||
        mouthPress >= 0.10
      ),


    anger:
      anger >= thresholds.anger &&
      browDown >= 0.07 &&
      eyeSquint >= 0.15 &&
      smile < 0.30
  };

  // 7. Compare scores relative to thresholds
  const candidates = {
    joy: gates.joy
      ? joy / thresholds.joy
      : 0,

    sadness: gates.sadness
      ? sadness / thresholds.sadness
      : 0,

    anger: gates.anger
      ? anger / thresholds.anger
      : 0
  };

  // 8. Select strongest eligible emotion
  let emotion = "neutral";
  let best = 1;

  for (
    const [name, score] of
    Object.entries(candidates)
  ) {
    if (score > best) {
      best = score;
      emotion = name;
    }
  }

  // 9. Return all data for Debug panel
  return {
    emotion,
    joy,
    sadness,
    anger,
    thresholds,
    candidates,
    gates,
    features: {
      smile,
      cheekSquint,
      mouthFrown,
      adjustedFrown,
      browInnerUp,
      browDown,
      eyeSquint,
      mouthPress
    }
  };
}

</script>

<script>


/* =========================
   EMOTION MUSIC PLAYER
   With 1-second sequential fade
========================= */

const emotionMusic = {
  joy: document.getElementById("joyMusic"),
  anger: document.getElementById("angerMusic"),
  sadness: document.getElementById("sadnessMusic")
};


const MUSIC_START_TIME = {
  joy: 0,
  anger: 5,
  sadness: 5
};

function getMusicStartTime(emotionName) {
  return MUSIC_START_TIME[emotionName] ?? 0;
}

  
let currentMusicEmotion = null;
let musicRequestId = 0;

let musicTransition = null;
let musicAnimationId = null;

const MUSIC_RECOVERY_MS = 250;

// Keep volume between 0 and 1
function clampVolume(value) {
  return Math.max(0, Math.min(1, value));
}

// Stop any previous volume animation
function stopMusicAnimation() {
  if (musicAnimationId !== null) {
    cancelAnimationFrame(musicAnimationId);
    musicAnimationId = null;
  }
}

// Play audio and safely handle browser errors
function safePlay(music) {
  if (!music || !music.paused) return;

  const request = music.play();

  if (request && typeof request.catch === "function") {
    request.catch(error => {
      console.log("Music playback failed:", error);
    });
  }
}

// Stop every track except the selected one
function stopOtherMusic(keepMusic = null) {
  Object.values(emotionMusic).forEach(music => {
    if (music !== keepMusic) {
      music.pause();
      music.currentTime = 0;
      music.volume = 1;
    }
  });
}

// Normal immediate music switching
function playEmotionMusic(emotionName) {

  musicRequestId++;
  musicTransition = null;
  stopMusicAnimation();

  const selectedMusic = emotionMusic[emotionName];

  if (!selectedMusic) {
    stopOtherMusic();
    currentMusicEmotion = null;
    return;
  }

  if (
    emotionName === currentMusicEmotion &&
    !selectedMusic.paused
  ) {
    selectedMusic.volume = 1;
    stopOtherMusic(selectedMusic);
    return;
  }

  stopOtherMusic(selectedMusic);

  selectedMusic.pause();
  selectedMusic.currentTime =
    getMusicStartTime(emotionName);
  selectedMusic.volume = 1;

  currentMusicEmotion = emotionName;
  safePlay(selectedMusic);
}

// Begin a pending emotion transition
function beginMusicTransition(targetEmotion, startTime) {

  musicRequestId++;
  stopMusicAnimation();

  const fromEmotion = currentMusicEmotion;
  const fromMusic = emotionMusic[fromEmotion];
  const toMusic = emotionMusic[targetEmotion];

  if (!toMusic) return;

  musicTransition = {
    fromEmotion,
    targetEmotion,
    startTime,
    fromStartVolume: fromMusic ? fromMusic.volume : 0
  };

  // Prepare the next track silently
  if (toMusic !== fromMusic) {
  toMusic.pause();

  toMusic.currentTime =
    getMusicStartTime(targetEmotion);

  toMusic.volume = 0;
  }

  function animate() {

    if (
      !musicTransition ||
      musicTransition.targetEmotion !== targetEmotion ||
      musicTransition.startTime !== startTime
    ) {
      return;
    }

    const elapsed = Math.max(
      0,
      performance.now() - startTime
    );

    const progress = clampVolume(
      elapsed / EMOTION_HOLD_MS
    );

    // First half: old music fades to zero
    if (fromMusic) {
      fromMusic.volume =
        musicTransition.fromStartVolume *
        (1 - clampVolume(progress * 2));
    }

    // Second half: new music fades in
    if (progress >= 0.5) {
      if (toMusic !== fromMusic) {
        toMusic.volume =
          clampVolume((progress - 0.5) * 2);

        safePlay(toMusic);
      }
    }

    if (progress < 1) {
      musicAnimationId =
        requestAnimationFrame(animate);
    } else {
      musicAnimationId = null;
    }
  }

  musicAnimationId =
    requestAnimationFrame(animate);
}

// Cancel a pending transition and restore old music
function cancelMusicTransition() {

  if (!musicTransition) return;

  musicRequestId++;
  stopMusicAnimation();

  const fromMusic =
    emotionMusic[musicTransition.fromEmotion];

  const toMusic =
    emotionMusic[musicTransition.targetEmotion];

  musicTransition = null;

  // Remove the unconfirmed new track
  if (toMusic && toMusic !== fromMusic) {
    toMusic.pause();
    toMusic.currentTime = 0;
    toMusic.volume = 1;
  }

  if (!fromMusic) return;

  const startVolume = fromMusic.volume;
  const recoveryStart = performance.now();

  safePlay(fromMusic);

  function recover() {

    const progress = clampVolume(
      (performance.now() - recoveryStart) /
      MUSIC_RECOVERY_MS
    );

    fromMusic.volume =
      startVolume + (1 - startVolume) * progress;

    if (progress < 1) {
      musicAnimationId =
        requestAnimationFrame(recover);
    } else {
      musicAnimationId = null;
    }
  }

  musicAnimationId =
    requestAnimationFrame(recover);
}

// Finalize a confirmed transition
function finishMusicTransition(targetEmotion) {

  musicRequestId++;
  stopMusicAnimation();

  const selectedMusic = emotionMusic[targetEmotion];

  musicTransition = null;

  if (!selectedMusic) {
    playEmotionMusic(targetEmotion);
    return;
  }

  stopOtherMusic(selectedMusic);

  selectedMusic.volume = 1;
  currentMusicEmotion = targetEmotion;

  safePlay(selectedMusic);
}

</script>  

</body>
